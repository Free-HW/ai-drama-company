<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Claw Dashboard{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0e1a; 
            --surface: #141824; 
            --surface2: #1a1f2e;
            --surface3: #222838;
            --text: #e8eaed; 
            --text2: #9ca3af; 
            --text3: #6b7280;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --green: #10b981; 
            --red: #ef4444; 
            --yellow: #f59e0b;
            --blue: #3b82f6;
            --border: #1f2937; 
            --radius: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,0.3);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: var(--bg); 
            color: var(--text); 
            line-height: 1.6;
            font-size: 14px;
        }
        .layout { 
            display: flex; 
            min-height: 100vh; 
        }
        
        /* 左侧边栏 */
        .sidebar {
            width: 280px; 
            background: var(--surface); 
            border-right: 1px solid var(--border);
            padding: 0;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        
        /* 顶部状态栏 */
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-logo {
            font-size: 18px; 
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-bar {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-label {
            color: var(--text2);
        }
        .status-value {
            color: var(--text);
            font-weight: 500;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-badge.running {
            background: rgba(16, 185, 129, 0.1);
            color: var(--green);
        }
        .status-badge.stopped {
            background: rgba(239, 68, 68, 0.1);
            color: var(--red);
        }
        
        /* 导航菜单 */
        .sidebar-nav {
            flex: 1;
            padding: 12px 0;
            overflow-y: auto;
        }
        .nav-section {
            margin-bottom: 20px;
        }
        .nav-section-title {
            padding: 8px 20px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .sidebar-nav a {
            display: flex; 
            align-items: center; 
            gap: 12px;
            padding: 10px 20px; 
            color: var(--text2); 
            text-decoration: none;
            transition: all 0.2s;
            font-size: 14px;
        }
        .sidebar-nav a:hover {
            color: var(--text); 
            background: var(--surface2);
        }
        .sidebar-nav a.active {
            color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
            border-left: 3px solid var(--accent);
            padding-left: 17px;
        }
        .sidebar-nav .icon { 
            font-size: 18px; 
            width: 20px;
            text-align: center;
        }
        
        /* 侧边栏底部 */
        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text3);
        }
        
        /* 主内容区 */
        .main { 
            flex: 1; 
            padding: 24px 32px; 
            overflow-y: auto;
            background: var(--bg);
        }
        
        /* 页面标题 */
        .page-header {
            margin-bottom: 24px;
        }
        .page-title { 
            font-size: 28px; 
            font-weight: 700; 
            margin-bottom: 8px;
        }
        .page-subtitle {
            font-size: 14px;
            color: var(--text2);
        }
        
        /* 网格布局 */
        .grid {
            display: grid; 
            gap: 20px;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        }
        .grid-2 {
            grid-template-columns: repeat(2, 1fr);
        }
        .grid-3 {
            grid-template-columns: repeat(3, 1fr);
        }
        .grid-4 {
            grid-template-columns: repeat(4, 1fr);
        }
        
        /* 卡片 */
        .card {
            background: var(--surface); 
            border: 1px solid var(--border);
            border-radius: var(--radius); 
            padding: 20px;
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }
        .card:hover {
            border-color: var(--surface3);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card-title { 
            font-size: 13px; 
            color: var(--text2); 
            margin-bottom: 12px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        
        /* KPI 卡片 */
        .kpi-value { 
            font-size: 32px; 
            font-weight: 700;
            line-height: 1.2;
        }
        .kpi-sub { 
            font-size: 13px; 
            color: var(--text2); 
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .kpi-trend {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-weight: 500;
        }
        .kpi-up { color: var(--green); }
        .kpi-down { color: var(--red); }
        .kpi-neutral { color: var(--text2); }
        
        /* 图表 */
        .chart-container { 
            position: relative; 
            height: 250px;
            margin-top: 12px;
        }
        
        /* 表格 */
        .table-container {
            overflow-x: auto;
            margin-top: 12px;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 13px;
        }
        th { 
            text-align: left; 
            color: var(--text2); 
            font-weight: 600; 
            padding: 12px; 
            border-bottom: 2px solid var(--border);
            background: var(--surface2);
        }
        td { 
            padding: 12px; 
            border-bottom: 1px solid var(--border);
        }
        tr:hover td { 
            background: var(--surface2); 
        }
        tr:last-child td {
            border-bottom: none;
        }
        
        /* 徽章 */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .badge-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--green);
        }
        .badge-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--red);
        }
        .badge-warning {
            background: rgba(245, 158, 11, 0.1);
            color: var(--yellow);
        }
        .badge-info {
            background: rgba(59, 130, 246, 0.1);
            color: var(--blue);
        }
        
        /* 统计行 */
        .stat-row { 
            display: flex; 
            gap: 20px; 
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .stat-item { 
            flex: 1; 
            min-width: 120px;
        }
        .stat-label { 
            font-size: 12px; 
            color: var(--text2);
            margin-bottom: 4px;
        }
        .stat-value { 
            font-size: 20px; 
            font-weight: 600;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center; 
            padding: 80px 20px; 
            color: var(--text2);
        }
        .empty-state .icon { 
            font-size: 64px; 
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .empty-state h2 {
            font-size: 20px;
            color: var(--text);
            margin-bottom: 8px;
        }
        .empty-state p {
            font-size: 14px;
            line-height: 1.6;
        }
        
        /* 响应式 */
        @media (max-width: 1024px) {
            .grid-4 { grid-template-columns: repeat(2, 1fr); }
            .grid-3 { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .sidebar { 
                position: fixed;
                left: -280px;
                top: 0;
                bottom: 0;
                z-index: 1000;
                transition: left 0.3s;
            }
            .sidebar.open {
                left: 0;
            }
            .main { padding: 16px; }
            .grid, .grid-2, .grid-3, .grid-4 { 
                grid-template-columns: 1fr; 
            }
            .kpi-value { font-size: 24px; }
            .page-title { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <span>📊</span>
                    <span>Dashboard</span>
                </div>
                {% if module %}
                <div class="status-bar">
                    <div class="status-item">
                        <span class="status-label">状态</span>
                        <span class="status-badge running">● 运行中</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Agent</span>
                        <span class="status-value">{{ module.agent_id }}</span>
                    </div>
                </div>
                {% endif %}
            </div>
            
            <div class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">导航</div>
                    <a href="/" class="{% if not module %}active{% endif %}">
                        <span class="icon">🏠</span> 
                        <span>总览</span>
                    </a>
                </div>
                
                {% if modules %}
                <div class="nav-section">
                    <div class="nav-section-title">模块</div>
                    {% for m in modules %}
                    <a href="/m/{{ m.id }}" class="{% if module and module.id == m.id %}active{% endif %}">
                        <span class="icon">{{ m.icon or '📊' }}</span> 
                        <span>{{ m.name }}</span>
                    </a>
                    {% endfor %}
                </div>
                {% endif %}
            </div>
            
            <div class="sidebar-footer">
                Powered by Claw Dashboard
            </div>
        </nav>
        
        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
